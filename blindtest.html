<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blind Test Live</title><style>:root{--bg:#061326;--p:#102747;--t:#fff;--m:#bad0e8;--g:#ffca54;--b:#2785ff;--v:#97d34f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#163a65,#061326 55%);color:var(--t);font:16px/1.45 system-ui}.app{max-width:980px;margin:auto;padding:16px}.card{background:#102747ee;border:1px solid #315274;border-radius:20px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}input,select,button{width:100%;padding:12px;border-radius:11px;border:1px solid #587798;background:#06182c;color:#fff;font:inherit}button{background:var(--b);border:0;font-weight:800;cursor:pointer}.gold{background:var(--g);color:#322300}.green{background:var(--v);color:#153000}.hidden{display:none}.msg{color:var(--g);min-height:24px}.song{padding:10px;background:#0b213c;border-radius:10px;margin:7px 0}.answer{padding:12px;background:#0b213c;border-radius:12px;margin:8px 0}.answer .grid{grid-template-columns:1fr 1fr}.small{color:var(--m);font-size:.9rem}h1{text-align:center}a{color:var(--g)}</style></head><body><main class="app"><h1>Blind Test Live</h1><p><a href="index.html">Retour au Grand Jeu</a></p><section id="login" class="card"><h2>Connexion</h2><div class="grid"><input id="name" placeholder="Prénom"><input id="code" inputmode="numeric" maxlength="4" placeholder="Code à 4 chiffres"></div><button id="enter">Entrer</button><p id="msg" class="msg"></p></section><section id="player" class="hidden"><div class="card"><h2 id="round">En attente...</h2><p id="status" class="small"></p><div id="response"><label>Titre</label><input id="titleAnswer" autocomplete="off"><label>Artiste</label><input id="artistAnswer" autocomplete="off"><button id="send" class="green">Envoyer ma réponse</button></div><div id="reveal" class="hidden"><h3>Réponse</h3><p id="solution"></p></div><p id="pmsg" class="msg"></p></div></section><section id="host" class="hidden"><div class="card"><h2>Préparation des 20 morceaux</h2><p class="small">Sélectionne les fichiers audio depuis cet appareil. Ils ne sont pas envoyés en ligne. Évite de recharger la page pendant le blind test.</p><div id="catalog"></div><button id="saveCatalog">Enregistrer les titres et artistes</button><p id="hmsg" class="msg"></p></div><div class="card"><h2>Régie</h2><div class="grid"><select id="songNo"></select><button id="play" class="green">Lancer le morceau</button><button id="close">Fermer les réponses</button><button id="show" class="gold">Révéler la réponse</button><button id="next">Morceau suivant</button></div><audio id="audio" controls style="width:100%;margin-top:12px"></audio><h3>Réponses reçues</h3><div id="answers"></div></div></section></main><script>
const URL='https://enwtpnbztcutgjhfrdbu.supabase.co',KEY='sb_publishable_zgid5i3qfWozIRA5Kn5M3w__xW_0iH4';let N=sessionStorage.getItem('reveillon_name')||'',C=sessionStorage.getItem('reveillon_code')||'',isHost=false,files={};const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function rpc(f,a){let r=await fetch(URL+'/rest/v1/rpc/'+f,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(a)}),raw=await r.text(),d;try{d=raw?JSON.parse(raw):null}catch{d=raw}if(!r.ok)throw Error(d?.message||raw);return d}
$('#name').value=N;$('#code').value=C;$('#enter').onclick=login;async function login(){N=$('#name').value.trim();C=$('#code').value.trim();try{let x=await rpc('login_game_player',{p_name:N,p_code:C});isHost=!!x.is_host;$('#login').classList.add('hidden');if(isHost){$('#host').classList.remove('hidden');await initHost()}else{$('#player').classList.remove('hidden');poll();setInterval(poll,2000)}}catch(e){$('#msg').textContent='Connexion impossible : '+e.message}}
async function poll(){try{let s=await rpc('blind_get_state',{p_name:N,p_code:C});$('#round').textContent='Morceau '+s.song_no+' / 20';$('#status').textContent=({waiting:'En attente du lancement',playing:'Réponses ouvertes',answers_closed:'Réponses fermées',revealed:'Réponse révélée',finished:'Blind test terminé'})[s.status]||s.status;$('#response').classList.toggle('hidden',s.status!=='playing');$('#reveal').classList.toggle('hidden',s.status!=='revealed');if(s.status==='revealed')$('#solution').textContent=s.title+' - '+s.artist;if(s.answer){$('#titleAnswer').value=s.answer.title_answer||'';$('#artistAnswer').value=s.answer.artist_answer||''}}catch(e){$('#pmsg').textContent='Synchronisation impossible.'}}
$('#send').onclick=async()=>{try{await rpc('blind_submit_answer',{p_name:N,p_code:C,p_title_answer:$('#titleAnswer').value,p_artist_answer:$('#artistAnswer').value});$('#pmsg').textContent='Réponse envoyée.'}catch(e){$('#pmsg').textContent='Réponses fermées ou erreur de connexion.'}};
async function initHost(){let d=await rpc('blind_host_answers',{p_name:N,p_code:C}),songs=d.songs||[];$('#catalog').innerHTML=songs.map(s=>`<div class="song"><b>${s.song_no}.</b><div class="grid"><input data-title="${s.song_no}" value="${esc(s.title)}" placeholder="Titre"><input data-artist="${s.song_no}" value="${esc(s.artist)}" placeholder="Artiste"><input data-file="${s.song_no}" type="file" accept="audio/*"></div></div>`).join('');document.querySelectorAll('[data-file]').forEach(x=>x.onchange=()=>{files[x.dataset.file]=x.files[0];$('#hmsg').textContent=x.files[0]?'Fichier '+x.dataset.file+' sélectionné : '+x.files[0].name:''});$('#songNo').innerHTML=songs.map(s=>`<option value="${s.song_no}">${s.song_no}. ${esc(s.title||'À compléter')}</option>`).join('');await refreshAnswers();setInterval(refreshAnswers,2000)}
$('#saveCatalog').onclick=async()=>{try{for(let n=1;n<=20;n++)await rpc('blind_host_configure_song',{p_name:N,p_code:C,p_song_no:n,p_title:document.querySelector(`[data-title="${n}"]`).value,p_artist:document.querySelector(`[data-artist="${n}"]`).value});$('#hmsg').textContent='Catalogue enregistré.'}catch(e){$('#hmsg').textContent='Erreur : '+e.message}};
async function control(status){let n=+$('#songNo').value;await rpc('blind_host_control',{p_name:N,p_code:C,p_song_no:n,p_status:status});await refreshAnswers()}
$('#play').onclick=async()=>{let n=$('#songNo').value,f=files[n];if(!f)return $('#hmsg').textContent='Choisis d’abord le fichier audio du morceau '+n+'.';const audio=$('#audio');if(audio.dataset.objectUrl){window.URL.revokeObjectURL(audio.dataset.objectUrl)}const objectUrl=window.URL.createObjectURL(f);audio.dataset.objectUrl=objectUrl;audio.src=objectUrl;try{await audio.play();await control('playing');$('#hmsg').textContent='Morceau lancé, réponses ouvertes.'}catch(e){console.error(e);$('#hmsg').textContent='Lecture impossible : '+(e.message||e)}};$('#close').onclick=()=>control('answers_closed');$('#show').onclick=()=>control('revealed');$('#next').onclick=async()=>{let n=Math.min(20,+$('#songNo').value+1);$('#songNo').value=n;$('#titleAnswer').value='';$('#artistAnswer').value='';await control('waiting')};async function refreshAnswers(){if(!isHost)return;try{let d=await rpc('blind_host_answers',{p_name:N,p_code:C});$('#answers').innerHTML=(d.answers||[]).map(a=>`<div class="answer"><b>${esc(a.player)}</b><div class="grid"><span>Titre : ${esc(a.title_answer)}</span><span>Artiste : ${esc(a.artist_answer)}</span></div></div>`).join('')||'<p class="small">Aucune réponse pour ce morceau.</p>'}catch(e){}}
if(N&&C)login();
</script></body></html>
